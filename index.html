<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BildungsatlasCH</title>
<style>
:root{
  --ink:#0f172a; --ink2:#334155; --mute:#64748b; --faint:#94a3b8;
  --line:#e2e8f0; --line2:#cbd5e1; --bg:#f8fafc; --card:#fff;
  --head:#1e293b; --acc:#38bdf8; --blue:#3b82f6; --blue-d:#1d4ed8;
  --stick:112px;
  --serif:-apple-system,BlinkMacSystemFont,"Avenir Next","Avenir","Segoe UI Semibold","Segoe UI",sans-serif;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:calc(var(--stick) + 8px)}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3,h4{margin:0;font-weight:600}
small,.small{font-size:12.5px}
.mute{color:var(--mute)}
.wrap{max-width:1560px;margin:0 auto;padding:0 24px}

/* Kopf & Leiste */
.top{background:var(--head);color:#e2e8f0;border-bottom:2px solid var(--acc);position:sticky;top:0;z-index:40}
.top .wrap{display:flex;align-items:flex-end;gap:32px;flex-wrap:wrap;padding-top:14px}
.brand{display:flex;align-items:baseline;gap:14px;padding-bottom:10px}
.brand .mark{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--acc);font-weight:600}
.brand h1{font:600 20px/1.2 var(--serif);color:#f8fafc}
.brand p{margin:2px 0 0;font-size:12.5px;color:var(--faint)}
.tabs{display:flex;gap:2px;margin-left:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--faint);padding:8px 14px 10px;font-weight:500;margin-bottom:-2px}
.tab:hover{color:#f1f5f9}
.tab[aria-selected=true]{color:#fff;border-bottom-color:#fff}
.bar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:var(--top-h,56px);z-index:30}
.bar .wrap{display:flex;align-items:center;gap:18px;flex-wrap:wrap;padding:9px 24px}
.fgroup{display:flex;align-items:center;gap:8px}
.flabel{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600}
.sel,.inp{border:1px solid var(--line2);border-radius:3px;background:#fff;padding:5px 8px;max-width:100%}
.sel:focus,.inp:focus{outline:2px solid var(--blue);outline-offset:1px}
.inp{width:180px}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:5px 12px;color:var(--ink2);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--head);color:#fff}

/* Karten & Basics */
main{padding:20px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px}
.card>.hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.card>.hd h2,.card>.hd h3{font:600 16px/1.3 var(--serif)}
.card>.bd{padding:14px 16px}
.hint{color:var(--mute);font-size:12.5px}
.split{display:grid;grid-template-columns:minmax(380px,580px) minmax(0,1fr);gap:20px;align-items:start}
.split>aside{position:sticky;top:calc(var(--stick) + 12px)}
.btn{border:1px solid var(--line2);background:#fff;border-radius:3px;padding:4px 10px;color:var(--ink2)}
.btn:hover{background:#f1f5f9}

/* Map & Legends */
svg.map{width:100%;height:auto;display:block}
svg.map path.kt{stroke:#fff;stroke-width:1.1;fill:var(--faint);cursor:pointer;transition:fill .12s}
svg.map path.kt:hover{filter:brightness(.88)}
svg.map path.kt.dim{cursor:default}
svg.map path.kt.sel{stroke:var(--ink);stroke-width:2}
svg.map .lakes path{fill:#e0f2fe;stroke:#fff;stroke-width:.6;pointer-events:none}
svg.map text{font:600 17px var(--sans);text-anchor:middle;dominant-baseline:central;pointer-events:none;user-select:none}
svg.map .ext line{stroke:var(--mute);stroke-width:.8}
svg.map .ext rect{fill:#fff;stroke:var(--line2);stroke-width:.8}
svg.map .ext text{fill:var(--ink2);font-size:16px}
#tip{position:fixed;z-index:100;pointer-events:none;background:var(--ink);color:#f8fafc;padding:5px 9px;border-radius:3px;font-size:12.5px;opacity:0;max-width:300px;transition:opacity .08s}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.leg-dot{display:inline-flex;align-items:center;gap:6px}
.split-badge{display:inline-block;width:12px;height:12px;background:linear-gradient(135deg,var(--c1) 50%,var(--c2) 50%);border:1px solid rgba(15,23,42,.18);vertical-align:-1px}
.grad{display:inline-block;width:120px;height:10px;vertical-align:middle;margin:0 6px;border:1px solid rgba(15,23,42,.18)}
.rank{display:grid;grid-template-columns:34px minmax(0,1fr) 90px;gap:4px 8px;align-items:center;font-variant-numeric:tabular-nums;margin-top:12px}
.rank button{border:0;background:none;padding:0;text-align:left;font-weight:500;cursor:pointer}
.rank button:hover{color:var(--blue-d)}
.rank .bar2{height:10px;background:#eff6ff;position:relative}
.rank .bar2 i{position:absolute;left:0;top:0;bottom:0;background:#3b82f6}
.rank .v{text-align:right}

/* Tables & Entries */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:600;text-align:left;padding:8px 12px;border-bottom:1px solid var(--line2);background:#f8fafc}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.entry{margin-bottom:10px;padding-bottom:10px;border-bottom:1px dashed var(--line2)}
.entry:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.entry .txt{white-space:pre-line}
.entry .src a{color:var(--blue-d);text-underline-offset:2px}
.matrix-cat{background-color:var(--c1);color:var(--txt);display:inline-block;padding:2px 6px;border-radius:2px;font-size:11.5px}

/* Matrix */
.mx-wrap{overflow:auto;max-height:calc(100vh - var(--stick) - 20px);border:1px solid var(--line);border-radius:4px;background:#fff}
table.mx{border-collapse:separate;border-spacing:0;font-size:13px}
table.mx th,table.mx td{border-bottom:1px solid var(--line);padding:0;text-align:center}
table.mx thead th{position:sticky;background:#fff;z-index:2;top:0;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2);padding:6px;font-weight:600;vertical-align:bottom;background:#f1f5f9;border-left:1px solid var(--line2)}
table.mx thead th.corner{left:0;z-index:4;text-align:left;padding-left:14px;min-width:190px}
table.mx th.vh{width:36px;min-width:36px}
table.mx th.vh button{writing-mode:vertical-rl;transform:rotate(180deg);border:0;background:none;text-align:left;font-size:11.5px;color:var(--ink2);padding:2px;max-height:148px;cursor:pointer}
table.mx td.kn{position:sticky;left:0;background:#fff;z-index:1;text-align:left;padding:5px 14px;white-space:nowrap}
table.mx td.kn button{border:0;background:none;padding:0;text-align:left;color:var(--ink)}
table.mx tr:hover td{background:#f1f5f9}
table.mx td.c{height:30px;cursor:default;border-left:1px solid var(--line2)}
.dot{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;cursor:pointer;border:1px solid rgba(15,23,42,.18)}
.dot.none{background:transparent;border:0}

/* Home & Suche */
.home-hero{text-align:center;padding:28px 16px 20px;max-width:820px;margin:0 auto}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:16px}
.home-card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:20px;cursor:pointer;transition:all .18s;display:flex;flex-direction:column}
.home-card:hover{transform:translateY(-3px);border-color:var(--blue);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.home-card .ic{display:flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:8px;background:#eff6ff;border:1px solid #bfdbfe;margin-bottom:12px;color:var(--blue)}
.home-card h3{font:600 20px var(--serif);color:var(--head);margin:0 0 8px}
.rsplit{display:grid;grid-template-columns:minmax(380px,500px) minmax(0,1fr);gap:20px;align-items:start}
.crit{padding:10px 0;border-bottom:1px solid var(--line)}
.crit .l1{display:flex;gap:8px;align-items:center}
.crit .cn{width:20px;height:20px;border-radius:50%;background:var(--head);color:#fff;font-size:12px;display:flex;align-items:center;justify-content:center}
.crit .l2,.crit .l3{margin-top:6px;margin-left:28px;display:flex;gap:8px;align-items:center}
.crit .x{margin-left:auto;border:0;background:none;font-size:18px;color:var(--mute)}
.conn{text-align:center;font-size:11.5px;letter-spacing:.1em;color:var(--mute);font-weight:600;padding:2px 0 0}
table.rs{width:100%;border-collapse:collapse}
table.rs th,table.rs td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.rs th{font-size:12px;color:var(--ink2);font-weight:600;background:#f8fafc}
table.rs td.ok{color:#047857;font-weight:600}
table.rs td.ko{color:var(--mute)}
table.rs tr.miss td{color:var(--mute)}

footer{border-top:1px solid var(--line);color:var(--mute);font-size:12.5px;padding:18px 0 40px}
footer a{color:var(--blue-d)}
.view{display:none}.view.on{display:block}
.empty{padding:36px 16px;text-align:center;color:var(--mute)}
@media (max-width:1180px){.split,.rsplit{grid-template-columns:minmax(0,1fr)}.split>aside{position:static}}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <span class="mark">BildungsatlasCH</span>
      <div>
        <h1>BildungsatlasCH</h1>
        <p id="subtitle">Interaktive Landkarte der kantonalen Regelungen</p>
      </div>
    </div>
    <nav class="tabs" role="tablist" aria-label="Ansicht">
      <button class="tab" role="tab" data-view="home">Übersicht</button>
      <button class="tab" role="tab" data-view="kantone">Kantone</button>
      <button class="tab" role="tab" data-view="bausteine">Bausteine</button>
      <button class="tab" role="tab" data-view="vergleich">Vergleich</button>
      <button class="tab" role="tab" data-view="suche">Reverse-Suche</button>
    </nav>
  </div>
</header>

<div class="bar" id="bar">
  <div class="wrap">
    <div class="fgroup" id="f-schulstufe"><span class="flabel">Schulstufe</span><select class="sel" id="s-schulstufe"></select></div>
    <div class="fgroup" id="f-unterstufe"><span class="flabel">Unterstufe</span><select class="sel" id="s-unterstufe"></select></div>
    <div class="fgroup" id="f-thema" hidden><span class="flabel">Thema</span><select class="sel" id="s-thema"></select></div>
    <div class="fgroup" id="f-aspekt" hidden><span class="flabel">Aspekt</span><select class="sel" id="s-aspekt"></select></div>
    <div class="fgroup" id="f-bezug" hidden><span class="flabel">Bezug</span><select class="sel" id="s-bezug"></select></div>
    <div class="fgroup" style="margin-left:auto"><input class="inp" id="q" type="search" placeholder="Volltextsuche..."></div>
  </div>
</div>

<main>
  <div class="wrap">
    <noscript><div class="card"><div class="bd">Diese Seite benötigt JavaScript.</div></div></noscript>
    <div id="loading" class="empty">Daten werden geladen ...</div>
    <section class="view" id="v-home"></section>
    <section class="view" id="v-kantone"></section>
    <section class="view" id="v-bausteine"></section>
    <section class="view" id="v-vergleich"></section>
    <section class="view" id="v-suche"></section>
  </div>
</main>

<footer>
  <div class="wrap">
    <div id="meta">
       <p><b>BildungsatlasCH</b><br>Kontakt: <a href="mailto:sebig@phbern.ch">sebig@phbern.ch</a></p>
    </div>
    <p class="small" id="dsrc" style="margin-top:10px;color:var(--faint)"></p>
  </div>
</footer>
<div id="tip" role="tooltip"></div>

<!-- KARTEN-DATEN HIER EINFÜGEN: Ersetzen Sie dieses Skript mit dem originalen <script type="application/json" id="d-map"> aus SeBiG -->
<script type="application/json" id="d-map">{"W":916,"H":593,"cantons":{},"lakes":[]}</script>

<script>
'use strict';
/* ================================================================
   Konfiguration & Setup (für das explizite CSV-Schema)
================================================================ */
const DATA_URL = './daten.csv';
const NAMES = {AG:'Aargau',AI:'Appenzell Innerrhoden',AR:'Appenzell Ausserrhoden',BE:'Bern',BL:'Basel-Landschaft',BS:'Basel-Stadt',FR:'Freiburg',GE:'Genf',GL:'Glarus',GR:'Graubünden',JU:'Jura',LU:'Luzern',NE:'Neuenburg',NW:'Nidwalden',OW:'Obwalden',SG:'St. Gallen',SH:'Schaffhausen',SO:'Solothurn',SZ:'Schwyz',TG:'Thurgau',TI:'Tessin',UR:'Uri',VD:'Waadt',VS:'Wallis',ZG:'Zug',ZH:'Zürich',FL:'Liechtenstein'};
const EXT = {BS:[-34,-26], AR:[46,-34], AI:[52,16], ZG:[-8,-38], NW:[30,-36], OW:[-34,26], FL:[700,-60]};
const REQ = ['schulstufe','unterstufe','thema','aspekt','bezug','fragentitel','frage_text','kanton','darstellungsart','farb_palette','genauigkeit','farbwert_numerisch','kategorie_auswahl','kategorie_sortierung','anzeige_text','original_zitat','bemerkung','quelle_name','quelle_url'];
const QUAL_COLORS = ['#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#ef4444', '#06b6d4', '#f97316', '#ec4899', '#14b8a6', '#84cc16'];
const SEQ_COLORS = ['#eff6ff', '#dbeafe', '#bfdbfe', '#93c5fd', '#60a5fa', '#3b82f6', '#2563eb', '#1d4ed8', '#1e40af', '#1e3a8a'];

const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = (v, d=2) => v==null || v==='' ? '–' : Number(v).toLocaleString('de-CH', {maximumFractionDigits:d});
const de = (a,b) => String(a||'').localeCompare(String(b||''),'de');
const hex2rgb = h => [1,3,5].map(i => parseInt(h.slice(i,i+2),16));
const lum = h => { const [r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*r+.7152*g+.0722*b; };
const txtOn = h => lum(h) > .32 ? '#0f172a' : '#ffffff';
const mix = (a,b,t) => { const A=hex2rgb(a),B=hex2rgb(b); return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join(''); };
const blueScale = t => mix('#dbeafe','#1e3a8a',Math.max(0,Math.min(1,t)));
const linkify = (name, url) => url && /^https?:\/\//i.test(url) ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(name||'Quelle öffnen')} ↗</a>` : esc(name);
const tipEl = $('#tip');
function showTip(e, html){ tipEl.innerHTML = html; tipEl.style.opacity = 1; tipEl.style.left = Math.min(e.clientX+14, innerWidth-tipEl.offsetWidth-8)+'px'; tipEl.style.top = (e.clientY+14)+'px'; }
function hideTip(){ tipEl.style.opacity = 0; }

let BLOCKS = {}, B_LIST = [], ALL_ROWS = [];
let st = { view: 'home', schulstufe: '', unterstufe: '', thema: '', aspekt: '', bezug: '', q: '', selCanton: '', rev: { logic: 'AND', crit: [] } };

function parseCSV(text){
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  const first = text.split('\n',1)[0];
  const D = (first.split(';').length > first.split(',').length) ? ';' : ',';
  const rows = []; let row = [], f = '', q = false, i = 0, n = text.length;
  while (i < n){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i+1] === '"'){ f += '"'; i += 2; continue; } q = false; i++; continue; } f += ch; i++; continue; }
    if (ch === '"'){ q = true; i++; continue; }
    if (ch === D){ row.push(f); f = ''; i++; continue; }
    if (ch === '\r'){ i++; continue; }
    if (ch === '\n'){ row.push(f); rows.push(row); row = []; f = ''; i++; continue; }
    f += ch; i++;
  }
  if (f !== '' || row.length){ row.push(f); rows.push(row); }
  return rows;
}

function buildData(rows){
  const H = rows[0].map(h => h.trim());
  const miss = REQ.filter(c => !H.includes(c));
  if (miss.length) throw new Error('Spalten fehlen: ' + miss.join(', '));
  const ix = {}; H.forEach((h,i) => ix[h] = i);
  
  rows.slice(1).forEach(r => {
    if (r.every(c => c.trim() === '')) return;
    const g = c => (r[ix[c]] ?? '').trim();
    const kantonFull = g('kanton'); if(!kantonFull) return;
    const rec = { kantonFull, kCode: kantonFull.split('-')[0] };
    REQ.forEach(c => rec[c] = g(c));
    rec.fw = rec.farbwert_numerisch ? parseFloat(rec.farbwert_numerisch.replace(',','.')) : null;
    ALL_ROWS.push(rec);
    
    const bId = `${rec.schulstufe}|${rec.unterstufe}|${rec.thema}|${rec.aspekt}|${rec.bezug}`;
    if(!BLOCKS[bId]) {
        BLOCKS[bId] = { id: bId, s:rec.schulstufe, u:rec.unterstufe, t:rec.thema, a:rec.aspekt, b:rec.bezug, 
            ftitle: rec.fragentitel, ftext: rec.frage_text, mode: rec.darstellungsart || 'text', pal: rec.farb_palette,
            opts: [], rows: {} };
        B_LIST.push(BLOCKS[bId]);
    }
    BLOCKS[bId].rows[kantonFull] = rec;
    if (rec.kategorie_auswahl && !BLOCKS[bId].opts.some(x => x.name === rec.kategorie_auswahl)){
        BLOCKS[bId].opts.push({name: rec.kategorie_auswahl, sort: parseInt(rec.kategorie_sortierung)||999});
    }
  });
  B_LIST.forEach(b => {
      b.opts.sort((x,y) => x.sort - y.sort || de(x.name, y.name));
      b.options = b.opts.map(x => x.name);
  });
}

function getBlock(id) {
    if(id) return BLOCKS[id];
    return B_LIST.find(b => b.s === st.schulstufe && b.u === st.unterstufe && b.t === st.thema && b.a === st.aspekt && b.b === st.bezug);
}

function makeMap(host, o={}){
  const M = JSON.parse(document.getElementById('d-map').textContent);
  if(!M.W) return { paint(){} }; // Fallback if map JSON is missing
  let h = `<svg class="map" viewBox="0 0 ${M.W} ${M.H}"><defs>
      <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f8fafc"/><line x1="0" y1="0" x2="0" y2="6" stroke="#94a3b8" stroke-width="1.6"/></pattern>
      <g id="dyn-defs"></g>
    </defs>`;
  const KTS = Object.keys(NAMES);
  h += '<g>' + KTS.filter(k => k!=='FL').map(k => `<path class="kt" data-k="${k}" d="${M.cantons[k]?.d||''}"></path>`).join('') + '</g><g class="lakes">' + (M.lakes||[]).map(d => `<path d="${d}"/>`).join('') + '</g><g>' + KTS.filter(k => k!=='FL').map(k => { if(EXT[k] || !M.cantons[k]) return ''; return `<text data-t="${k}" x="${M.cantons[k].c[0]}" y="${M.cantons[k].c[1]}">${k}</text>`; }).join('') + '</g>';
  h += '<g class="ext">' + Object.keys(EXT).map(k => { 
      const c = M.cantons[k] ? M.cantons[k].c : [0,0], [dx,dy] = EXT[k], x = k==='FL' ? dx : c[0]+dx, y = k==='FL' ? dy : c[1]+dy;
      return `<g data-e="${k}" class="kt" data-k="${k}" style="cursor:pointer">${k!=='FL'?`<line x1="${c[0]}" y1="${c[1]}" x2="${x}" y2="${y}"/><circle cx="${c[0]}" cy="${c[1]}" r="2" fill="#475569"/>`:''}<rect x="${x-17}" y="${y-11}" width="34" height="22" rx="2"/><text x="${x}" y="${y}">${k}</text></g>`; 
  }).join('') + '</g></svg>';
  host.innerHTML = h; const svg = host.firstElementChild, dynDefs = svg.querySelector('#dyn-defs');
  svg.addEventListener('click', e => { const p = e.target.closest('.kt'); if(p && o.onClick) o.onClick(p.dataset.k); });
  svg.addEventListener('mousemove', e => { const p = e.target.closest('.kt'); if(p) showTip(e, o.tip ? o.tip(p.dataset.k) : esc(NAMES[p.dataset.k])); else hideTip(); });
  svg.addEventListener('mouseleave', hideTip);
  return { paint(fn){ dynDefs.innerHTML = ''; KTS.forEach(k => {
        const r = fn(k) || {};
        if(r.grad) { const gid = `grad-${k}`; dynDefs.insertAdjacentHTML('beforeend', `<linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1"><stop offset="50%" stop-color="${r.c1}"/><stop offset="50%" stop-color="${r.c2}"/></linearGradient>`); r.fill = `url(#${gid})`; }
        const p = svg.querySelector(`path[data-k="${k}"]`); if(p) { p.style.fill = r.fill || '#e2e8f0'; p.classList.toggle('sel', !!r.sel); p.classList.toggle('dim', !!r.dim); }
        const hexOk = (r.c1 && r.c1.startsWith('#')) || (r.fill && r.fill.startsWith('#')); const tc = hexOk ? txtOn(r.c1 || r.fill) : '#0f172a';
        const t = svg.querySelector(`text[data-t="${k}"]`); if(t) t.style.fill = tc;
        const e = svg.querySelector(`g[data-e="${k}"]`); if(e) { e.querySelector('rect').style.fill = r.fill || '#fff'; e.querySelector('text').style.fill = tc; e.querySelector('rect').style.stroke = r.sel ? '#0f172a' : '#cbd5e1'; e.querySelector('rect').style.strokeWidth = r.sel ? 2 : 0.8; }
      });
  }};
}

function getCatColor(cat, block) {
    if(!cat) return '#e2e8f0';
    const idx = block.options.indexOf(cat); if(idx < 0) return '#cbd5e1';
    return block.pal === 'sequenziell' ? SEQ_COLORS[idx % SEQ_COLORS.length] : QUAL_COLORS[idx % QUAL_COLORS.length];
}

/* ================================================================
   Ansichten (Home, Bausteine, Kantone, Vergleich, Suche)
================================================================ */
function renderHome() {
    $('#v-home').innerHTML = `<div class="home-hero"><h2>BildungsatlasCH</h2><p>Interaktive Landkarte der kantonalen Regelungen. Was regelt mein Kanton? Wie verbreitet ist ein Merkmal?</p></div>
    <div class="home-grid">
      <div class="home-card" onclick="setView('kantone')"><div class="ic">🗺️</div><h3>Kantone</h3><p>Alle Antworten eines Kantons in der Übersicht.</p><span class="btn-go">→ Kantone ansehen</span></div>
      <div class="home-card" onclick="setView('bausteine')"><div class="ic">🔍</div><h3>Bausteine (Karte)</h3><p>Ein Merkmal für alle Kantone auf der interaktiven Karte.</p><span class="btn-go">→ Karte öffnen</span></div>
      <div class="home-card" onclick="setView('vergleich')"><div class="ic">📊</div><h3>Vergleich</h3><p>Die Matrix stellt alle Kantone und Ausprägungen nebeneinander.</p><span class="btn-go">→ Matrix öffnen</span></div>
      <div class="home-card" onclick="setView('suche')"><div class="ic">🔎</div><h3>Reverse-Suche</h3><p>Welche Kantone erfüllen ganz bestimmte Bedingungen?</p><span class="btn-go">→ Kantone suchen</span></div>
    </div>`;
}

let mapM = null;
function renderBausteine() {
    const host = $('#v-bausteine'), b = getBlock();
    if(!b) { host.innerHTML = '<div class="empty">Bitte wählen Sie ein Merkmal in der Filterleiste aus.</div>'; return; }
    
    host.innerHTML = `<div class="split"><aside class="card"><div class="hd"><h2>Karte</h2></div><div class="bd"><div id="mmap"></div><div id="mleg" class="legend" style="margin-top:12px"></div></div></aside>
      <section><div class="card" style="margin-bottom:20px"><div class="hd"><h3>${esc(b.ftitle || b.t)}</h3></div><div class="bd"><div style="font-weight:600;margin-bottom:6px">${esc(b.ftext)}</div><div id="mrank"></div></div></div><div id="mdetail"></div></section></div>`;
    
    mapM = makeMap($('#mmap'), { onClick: k => { st.selCanton = k; renderDetail(b); }, tip: k => {
        let t = `<b>${esc(NAMES[k])}</b><br>`, rD = b.rows[`${k}-d`] || b.rows[k], rF = b.rows[`${k}-f`];
        const p = (r, l) => {
            if(!r) return ''; let res = l ? `<br><i>${l}:</i> ` : '';
            res += r.anzeige_text || 'Kein Eintrag'; return res;
        };
        if(rF && rD && (rD.anzeige_text !== rF.anzeige_text)) t += p(rD, 'Deutschsprachiger Teil') + p(rF, 'Französischsprachiger Teil'); else t += p(rD, ''); return t;
    }});
    
    let leg = '', rank = '';
    if(b.mode === 'kategorial') {
        leg += b.options.map(o => { const c = getCatColor(o,b); return `<span class="leg-dot"><span class="split-badge" style="--c1:${c};--c2:${c}"></span>${esc(o)}</span>`; }).join('');
        rank = `<table class="tbl"><tbody>` + b.options.map(o => { const ks = Object.keys(NAMES).filter(k => { const r = b.rows[k]||b.rows[k+'-d']; return r && r.kategorie_auswahl === o; }); return ks.length ? `<tr><td style="width:50%"><span class="matrix-cat" style="--c1:${getCatColor(o,b)};--txt:${txtOn(getCatColor(o,b))}">${esc(o)}</span></td><td>${ks.join(', ')}</td></tr>` : ''; }).join('') + `</tbody></table>`;
    } else if (b.mode === 'numerisch') {
        const vals = Object.values(b.rows).map(r => r.fw).filter(v => v !== null), min = Math.min(...vals), max = Math.max(...vals);
        leg = `<span>Minimaler Wert <span class="grad" style="background:linear-gradient(90deg,#dbeafe,#1e3a8a)"></span> Maximaler Wert</span> <span class="leg-dot" style="margin-left:10px"><span class="split-badge" style="--c1:#e2e8f0;--c2:#e2e8f0;background:url(#hatch)"></span> Spanne/Schwelle</span>`;
        const ktv = Object.keys(NAMES).map(k => { const r = b.rows[k+'-d'] || b.rows[k]; return { k, v: r ? r.fw : null, r }; }).filter(x => x.v !== null).sort((p,q) => q.v - p.v);
        rank = `<div class="rank">` + ktv.map(x => `<button onclick="st.selCanton='${x.k}';renderDetail(getBlock());">${x.k}</button><div class="bar2"><i style="width:${max?x.v/max*100:0}%"></i></div><div class="v">${esc(x.r.anzeige_text)}</div>`).join('') + `</div>`;
    } else leg = `<span class="leg-dot"><span class="split-badge" style="--c1:#94a3b8;--c2:#94a3b8"></span>Eintrag vorhanden</span>`;
    
    $('#mleg').innerHTML = leg; $('#mrank').innerHTML = rank;
    mapM.paint(k => {
        const rD = b.rows[`${k}-d`] || b.rows[k], rF = b.rows[`${k}-f`], res = { sel: st.selCanton === k };
        const getFill = r => {
            if(!r) return { c1: '#e2e8f0' };
            if(b.mode === 'kategorial') return { c1: getCatColor(r.kategorie_auswahl, b) };
            if(b.mode === 'numerisch') {
                if(r.fw === null) return { c1: '#94a3b8' };
                const vals = Object.values(b.rows).map(rx => rx.fw).filter(v => v !== null), min = Math.min(...vals), max = Math.max(...vals);
                const c = blueScale(max===min ? 0.6 : (r.fw-min)/(max-min));
                if(['Spanne','Schwelle'].includes(r.genauigkeit)) return { c1: c, fill: 'url(#hatch)' };
                return { c1: c };
            }
            return r.anzeige_text ? { c1: '#94a3b8' } : { c1: '#e2e8f0' };
        };
        const fD = getFill(rD), fF = rF ? getFill(rF) : null;
        if(fF && rD && rD.anzeige_text !== rF.anzeige_text) { res.grad = true; res.c1 = fD.c1; res.c2 = fF.c1; } else { res.c1 = fD.c1; res.fill = fD.fill || fD.c1; }
        return res;
    });
    renderDetail(b);
}

function renderDetail(b) {
    const el = $('#mdetail'); if(!st.selCanton) { el.innerHTML = ''; return; }
    const k = st.selCanton, rD = b.rows[`${k}-d`] || b.rows[k], rF = b.rows[`${k}-f`];
    const renderR = (r, lbl) => {
        if(!r) return ''; let h = lbl ? `<h4>${lbl}</h4>` : ''; h += `<div class="entry"><div class="txt" style="font-size:16px;margin-bottom:8px"><b>${esc(r.anzeige_text)}</b></div>`;
        if(r.original_zitat) h += `<div class="txt clamp">«${esc(r.original_zitat)}»</div>`;
        if(r.bemerkung) h += `<div class="txt mute small" style="margin-top:6px"><i>Anmerkung:</i> ${esc(r.bemerkung)}</div>`;
        h += `<div class="src small mute" style="margin-top:8px">${linkify(r.quelle_name, r.quelle_url)}</div></div>`; return h;
    };
    let html = `<div class="card"><div class="hd"><h3>${esc(NAMES[k])} (${k})</h3></div><div class="bd">`;
    if(!rD && !rF) html += `<div class="empty">Kein Eintrag.</div>`; else { if(rD && rF && rD.anzeige_text !== rF.anzeige_text) html += renderR(rD, 'Deutschsprachiger Teil') + renderR(rF, 'Französischsprachiger Teil'); else html += renderR(rD, ''); }
    el.innerHTML = html + `</div></div>`;
}

function renderKantone() {
    const host = $('#v-kantone'), k = st.selCanton || 'ZH';
    const ktList = Object.keys(NAMES).map(x => `<button class="${x===k?'on':''}" onclick="st.selCanton='${x}';renderKantone();">${x}</button>`).join('');
    const blocks = B_LIST.filter(b => b.s === st.schulstufe && (b.rows[k] || b.rows[k+'-d']));
    const byThema = {}; blocks.forEach(b => { (byThema[b.t] ??= []).push(b); });
    let html = `<div class="card" style="margin-bottom:20px"><div class="bd"><div class="ktlist">${ktList}</div></div></div>`;
    for(let th in byThema) {
        html += `<div class="card" style="margin-bottom:20px"><div class="hd"><h3>${esc(th)}</h3></div><table class="tbl"><thead><tr><th style="width:30%">Aspekt / Bezug</th><th>Antwort</th></tr></thead><tbody>`;
        byThema[th].forEach(b => { const r = b.rows[k] || b.rows[k+'-d']; if(!r) return; html += `<tr><td><b>${esc(b.a)}</b>${b.b ? '<br>'+esc(b.b) : ''}</td><td><b style="font-size:15px">${esc(r.anzeige_text)}</b><div style="margin-top:4px" class="txt">${esc(r.original_zitat)}</div>${r.bemerkung ? `<div class="mute small" style="margin-top:4px">Anmerkung: ${esc(r.bemerkung)}</div>`:''}</td></tr>`; });
        html += `</tbody></table></div>`;
    }
    host.innerHTML = html;
}

function renderVergleich() {
    const host = $('#v-vergleich'), blocks = B_LIST.filter(b => b.s === st.schulstufe && b.t === st.thema);
    if(!blocks.length) { host.innerHTML = '<div class="empty">Keine Daten für dieses Thema.</div>'; return; }
    let ths = `<tr><th class="corner">Kanton</th>`, rows = '';
    blocks.forEach(b => { ths += `<th class="vh"><button title="${esc(b.ftext)}">${esc(b.a)} ${esc(b.b)}</button></th>`; }); ths += `</tr>`;
    Object.keys(NAMES).forEach(k => { const rD = blocks.some(b => b.rows[k+'-d']); if(rD) { rows += buildVergleichRow(k, 'd', blocks) + buildVergleichRow(k, 'f', blocks); } else rows += buildVergleichRow(k, '', blocks); });
    host.innerHTML = `<div class="card"><div class="hd"><h3>Matrix: ${esc(st.thema)}</h3><span class="hint">Alle Aspekte im Vergleich</span></div><div class="mx-wrap"><table class="mx"><thead>${ths}</thead><tbody>${rows}</tbody></table></div></div>`;
    const t = $('#v-vergleich table'); t.style.setProperty('--r1', t.querySelector('thead tr').offsetHeight + 'px'); $('.mx-wrap').style.setProperty('--r1', t.querySelector('thead tr').offsetHeight + 'px');
}

function buildVergleichRow(k, split, blocks) {
    const kLbl = split ? `${k} (${split})` : k, kKey = split ? `${k}-${split}` : k;
    let tr = `<tr><td class="kn"><b>${kLbl}</b> ${!split?esc(NAMES[k]):''}</td>`;
    blocks.forEach(b => {
        const r = b.rows[kKey] || b.rows[k];
        if(!r) { tr += `<td class="c"><span class="dot none"></span></td>`; return; }
        if(b.mode === 'kategorial' && r.kategorie_auswahl) {
            tr += `<td class="c"><span class="dot" style="background:${getCatColor(r.kategorie_auswahl, b)}" title="${esc(r.anzeige_text)}"></span></td>`;
        } else if (b.mode === 'numerisch' && r.fw !== null) {
            tr += `<td class="c" title="${esc(r.anzeige_text)}">${fmt(r.fw)}${r.bemerkung?'<span style="font-size:16px;color:#f59e0b;vertical-align:-4px;margin-left:2px">•</span>':''}</td>`;
        } else tr += `<td class="c"><span class="dot yes" style="background:#94a3b8" title="${esc(r.anzeige_text)}"></span></td>`;
    });
    return tr + `</tr>`;
}

// Reverse Suche
let mapR = null;
function renderSuche(){
  const host = $('#v-suche');
  host.innerHTML = `<div class="rsplit"><section class="card"><div class="hd"><h2>Abfrage</h2></div><div class="bd">
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><span>Ein Kanton erfüllt</span>
        <div class="seg" id="lgSeg"><button data-l="AND" aria-pressed="${st.rev.logic==='AND'}">alle (UND)</button><button data-l="OR" aria-pressed="${st.rev.logic==='OR'}">mindestens eines (ODER)</button></div></div>
      <div id="crits"></div><div style="margin-top:12px"><button class="btn" id="addCrit">+ Kriterium</button> <button class="btn" id="resetCrit">Reset</button></div>
    </div></section>
    <section><div class="card"><div class="hd"><h3>Ergebnis</h3><span id="rcount" class="hint" style="margin-left:auto"></span></div><div class="bd"><div id="rmap" style="max-width:640px"></div><div id="rres" style="margin-top:16px"></div></div></div></section></div>`;
  mapR = makeMap($('#rmap'));
  $('#lgSeg').onclick = e => { const b = e.target.closest('button'); if(b){ st.rev.logic = b.dataset.l; renderSuche(); } };
  $('#addCrit').onclick = () => { st.rev.crit.push({bId:'', neg:0, cVal:'', op:'>=', nVal:0}); renderSuche(); };
  $('#resetCrit').onclick = () => { st.rev.crit = []; renderSuche(); };
  renderCritList();
}

function renderCritList() {
    const cr = st.rev.crit, host = $('#crits');
    const validBlocks = B_LIST.filter(b => b.s === st.schulstufe);
    host.innerHTML = cr.length ? cr.map((c,i) => {
        const blockOpts = validBlocks.map(b => `<option value="${esc(b.id)}" ${c.bId===b.id?'selected':''}>${esc(b.t)} - ${esc(b.a)} ${esc(b.b)}</option>`).join('');
        const b = BLOCKS[c.bId];
        let l3 = '';
        if (b && b.mode === 'kategorial') l3 = `<select class="sel cv" style="width:100%">${b.options.map(o => `<option value="${esc(o)}" ${c.cVal===o?'selected':''}>${esc(o)}</option>`).join('')}</select>`;
        if (b && b.mode === 'numerisch') l3 = `<select class="sel cop"><option value=">=" ${c.op==='>='?'selected':''}>≥</option><option value="<=" ${c.op==='<='?'selected':''}>≤</option></select><input type="number" class="inp cnv" value="${c.nVal}" style="width:80px">`;
        return `<div class="crit" data-i="${i}"><div class="l1"><span class="cn">${i+1}</span><select class="sel neg"><option value="0" ${!c.neg?'selected':''}>hat</option><option value="1" ${c.neg?'selected':''}>hat nicht</option></select><button class="x">×</button></div>
        <div class="l2" style="margin-top:6px"><select class="sel bid" style="width:100%"><option value="">-- Merkmal wählen --</option>${blockOpts}</select></div>
        ${l3 ? `<div class="l3" style="margin-top:6px">${l3}</div>` : ''}</div>`;
    }).join('') : '<div class="empty">Kein Kriterium.</div>';
    
    $$('.crit', host).forEach(el => {
        const c = cr[+el.dataset.i];
        el.querySelector('.neg').onchange = e => { c.neg = +e.target.value; renderSuche(); };
        el.querySelector('.bid').onchange = e => { c.bId = e.target.value; const b = BLOCKS[c.bId]; if(b && b.options.length) c.cVal = b.options[0]; renderSuche(); };
        el.querySelector('.x').onclick = () => { cr.splice(+el.dataset.i, 1); renderSuche(); };
        if(el.querySelector('.cv')) el.querySelector('.cv').onchange = e => { c.cVal = e.target.value; renderSuche(); };
        if(el.querySelector('.cop')) el.querySelector('.cop').onchange = e => { c.op = e.target.value; renderSuche(); };
        if(el.querySelector('.cnv')) el.querySelector('.cnv').oninput = e => { c.nVal = parseFloat(e.target.value); renderSuche(); };
    });
    
    // Evaluate
    const and = st.rev.logic === 'AND';
    const evalCrit = (k, c) => {
        const b = BLOCKS[c.bId]; if(!b) return {ok: !!c.neg, ev: '-'};
        const r = b.rows[k+'-d'] || b.rows[k]; if(!r) return {ok: !!c.neg, ev: 'Kein Eintrag'};
        let has = false;
        if(b.mode === 'kategorial') has = r.kategorie_auswahl === c.cVal;
        else if(b.mode === 'numerisch') { if(r.fw!==null) has = c.op==='>=' ? r.fw >= c.nVal : r.fw <= c.nVal; }
        return {ok: c.neg ? !has : has, ev: r.anzeige_text || 'Vorhanden'};
    };
    
    const res = Object.keys(NAMES).map(k => { const ev = cr.map(c => evalCrit(k,c)); return {k, ev, hit: cr.length ? (and ? ev.every(x => x.ok) : ev.some(x => x.ok)) : false}; });
    const hits = res.filter(r => r.hit);
    $('#rcount').textContent = cr.length ? `${hits.length} von 26 Kantonen` : '';
    mapR.paint(k => { const r = res.find(x => x.k === k); if (!cr.length) return {fill: '#e2e8f0'}; return r.hit ? {fill:'#f59e0b'} : {fill:'#e2e8f0', dim:true}; });
    
    if (cr.length) {
        $('#rres').innerHTML = `<table class="rs"><thead><tr><th>Kanton</th>${cr.map((c,i)=>`<th>Krit. ${i+1}</th>`).join('')}</tr></thead><tbody>
        ${res.filter(r=>r.hit).map(r => `<tr><td><b>${r.k}</b></td>${r.ev.map(x=>`<td class="${x.ok?'ok':'ko'}">${x.ok?'✓':'✗'} ${esc(x.ev)}</td>`).join('')}</tr>`).join('')}
        </tbody></table>`;
    } else $('#rres').innerHTML = '';
}

function syncBar(){
  const sf = [...new Set(B_LIST.map(b => b.s))].sort(de); if(!st.schulstufe && sf.length) st.schulstufe = sf[0];
  const bSchul = B_LIST.filter(b => b.s === st.schulstufe);
  const us = [...new Set(bSchul.map(b => b.u).filter(Boolean))].sort(de); if(us.length && !st.unterstufe) st.unterstufe = us[0]; if(!us.length) st.unterstufe = '';
  const bUnt = bSchul.filter(b => !st.unterstufe || b.u === st.unterstufe);
  const th = [...new Set(bUnt.map(b => b.t))]; if(!st.thema || !th.includes(st.thema)) st.thema = th[0] || '';
  const bTh = bUnt.filter(b => b.t === st.thema);
  const as = [...new Set(bTh.map(b => b.a).filter(Boolean))]; if(as.length && !as.includes(st.aspekt)) st.aspekt = as[0] || ''; if(!as.length) st.aspekt = '';
  const bAs = bTh.filter(b => !st.aspekt || b.a === st.aspekt);
  const bz = [...new Set(bAs.map(b => b.b).filter(Boolean))]; if(bz.length && !bz.includes(st.bezug)) st.bezug = bz[0] || ''; if(!bz.length) st.bezug = '';
  
  const fill = (id, arr, val, emp) => { $('#f-'+id).hidden = arr.length===0; $('#s-'+id).innerHTML = (emp?`<option value="">${emp}</option>`:'') + arr.map(x => `<option value="${esc(x)}" ${x===val?'selected':''}>${esc(x)}</option>`).join(''); }
  fill('schulstufe', sf, st.schulstufe); fill('unterstufe', us, st.unterstufe, 'Alle Unterstufen');
  fill('thema', th, st.thema); fill('aspekt', as, st.aspekt); fill('bezug', bz, st.bezug);
}

function showView(){
  $$('.view').forEach(s => { const on = s.id === 'v-' + st.view; s.classList.toggle('on', on); if (!on) s.innerHTML = ''; });
  hideTip();
  if(st.view === 'home') renderHome(); if(st.view === 'bausteine') renderBausteine();
  if(st.view === 'kantone') renderKantone(); if(st.view === 'vergleich') renderVergleich(); if(st.view === 'suche') renderSuche();
}
function setView(v){ st.view = v; $$('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.view === st.view)); syncBar(); showView(); }

$$('.tab').forEach(t => t.onclick = () => setView(t.dataset.view));
$$('.sel').forEach(s => s.onchange = e => {
    const id = e.target.id.replace('s-', ''); st[id] = e.target.value;
    if(id==='schulstufe') st.unterstufe = st.thema = st.aspekt = st.bezug = '';
    if(id==='unterstufe') st.thema = st.aspekt = st.bezug = '';
    if(id==='thema') st.aspekt = st.bezug = ''; if(id==='aspekt') st.bezug = '';
    syncBar(); showView();
});
let qt; $('#q').oninput = e => { clearTimeout(qt); qt = setTimeout(()=>{ st.q = e.target.value; showView(); }, 300); };

async function boot(){
  try {
    const res = await fetch(DATA_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    buildData(parseCSV(await res.text()));
    $('#dsrc').textContent = `Datenquelle: daten.csv · ${ALL_ROWS.length} Einträge`;
    $('#loading').remove();
    setView('home');
  } catch (err) { $('#loading').textContent = 'Die Daten konnten nicht geladen werden: ' + err.message; }
}
boot();
</script>
